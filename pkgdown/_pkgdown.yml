home:
  title: pharos
  description: Graphics, colour, formatting, and string utilities for the DescToolsX ecosystem

destination: docs

development:
  mode: auto

template:
  default_assets: true
  bootstrap: 5
  bootswatch: flatly
  math-rendering: mathjax

navbar:
  structure:
    left:  [version, home, reference, articles, news]
    right: [github]
  components:
    version:
      icon: fa-book
      menu:
      - text: "Documentation for version of package:"
      - text: Released
        href: https://andrisignorell.github.io/pharos/
      - text: In-development
        href: https://andrisignorell.github.io/pharos/dev/
    articles:
      text: Tutorials
      menu:
      - text: "PDF:"
      - text: Formatting
        href: https://github.com/AndriSignorell/pharos/blob/main/vignettes/Format.pdf

